services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: healthify_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_NAME: Healthify
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      APP_DEBUG: "false"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-healthify}
      DB_USERNAME: ${DB_USERNAME:-healthify}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: healthify_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-healthify}
      MYSQL_USER: ${DB_USERNAME:-healthify}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-secret}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db_data:
